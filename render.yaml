# PipMora full-stack deployment blueprint (not yet provisioned).
# Review plan pricing, privacy obligations and SMTP before public use.
services:
  - type: web
    name: pipmora-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: pipmora-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: pipmora-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_DEV_RESET_LINK
        value: "false"
      - key: AI_EXTERNAL_ENABLED
        value: "false"
  - type: web
    name: pipmora-web
    runtime: docker
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: web
          name: pipmora-api
          property: hostport
      - key: NEXT_PUBLIC_API_URL
        value: ""
databases:
  - name: pipmora-postgres
    databaseName: pipmora
    user: pipmora
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
